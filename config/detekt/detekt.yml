# detekt baseline configuration for jvplayer-kit.
# Intentionally lean for the Wave 0 skeleton; tightened as product code lands.
build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  # The architecture test's encryption scan walks module → file → word/import with
  # a couple of nested loops; allow that depth. Default (4) is too strict for it.
  NestedBlockDepth:
    active: true
    threshold: 6

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  WildcardImport:
    active: true

naming:
  active: true

# Function-name checks flag Kotlin backtick-quoted test names (`fun \`does x\`()`),
# which we use for readable architecture-test descriptions, and PascalCase
# @Composable functions (Android/Compose convention) — allow both.
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - "Test"
      - "Composable"
