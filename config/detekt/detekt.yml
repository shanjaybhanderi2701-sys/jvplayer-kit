# detekt baseline configuration for jvplayer-kit.
# Intentionally lean for the Wave 0 skeleton; tightened as product code lands.
build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  # The architecture test's encryption scan walks module → file → word/import with
  # a couple of nested loops; allow that depth. Default (4) is too strict for it.
  NestedBlockDepth:
    active: true
    threshold: 6
  # @Composable components (slot APIs, styling knobs, test tags) routinely exceed the
  # default parameter limit by convention — exempt them, as we already do for FunctionNaming.
  LongParameterList:
    active: true
    ignoreAnnotated:
      - "Composable"
  # Declarative @Composable layout (nested slots, gesture wiring, remembered state) runs long
  # by nature — a Compose function is a UI tree, not imperative logic. Exempt them here the same
  # way we exempt LongParameterList; non-Composable functions still hold the default 60-line cap.
  LongMethod:
    active: true
    ignoreAnnotated:
      - "Composable"

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  WildcardImport:
    active: true

naming:
  active: true

# Function-name checks flag Kotlin backtick-quoted test names (`fun \`does x\`()`),
# which we use for readable architecture-test descriptions, and PascalCase
# @Composable functions (Android/Compose convention) — allow both.
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - "Test"
      - "Composable"
