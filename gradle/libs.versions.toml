# Version catalog — single source of truth for dependency versions.
#
# Media3 pinning (plan §2.4/§7.1): Media3 ships NO Maven BOM. One `media3`
# version is pinned here and referenced everywhere so exoplayer/ui/datasource/
# common stay lockstep — mixed Media3 versions crash at runtime.
[versions]
media3 = "1.5.1"          # PIN — bump deliberately, re-verify on-device each bump.
kotlin = "2.0.21"
agp = "8.7.3"
coreKtx = "1.13.1"
appcompat = "1.7.0"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
coroutines = "1.9.0"
junit = "4.13.2"
kotlinTestJunit = "2.0.21"
androidxTestJunit = "1.2.1"
androidxTestCore = "1.6.1"
espresso = "3.6.1"
robolectric = "4.13"
ktlint = "12.1.1"
detekt = "1.23.7"

[libraries]
# --- Media3 (only :player-core / :player-ui; NEVER :player-api) ---
media3-exoplayer  = { module = "androidx.media3:media3-exoplayer",  version.ref = "media3" }
media3-ui         = { module = "androidx.media3:media3-ui",         version.ref = "media3" }
# NOTE: androidx.media3:media3-ui-compose was first published at 1.6.0 — it does
# NOT exist at the pinned 1.5.1 (verified against Google Maven). Re-add only when
# the Media3 pin is bumped to >= 1.6.0 for the Compose UI wave (plan §2.4 lists it,
# but the coordinate is unavailable at 1.5.1). Wave 0 needs no Compose Media3 UI.
# media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-common     = { module = "androidx.media3:media3-common",     version.ref = "media3" }

# --- AndroidX ---
androidx-core-ktx        = { module = "androidx.core:core-ktx",              version.ref = "coreKtx" }
androidx-appcompat       = { module = "androidx.appcompat:appcompat",        version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# --- Compose (BOM-managed; only :player-ui / :demo) ---
androidx-compose-bom        = { module = "androidx.compose:compose-bom",   version.ref = "composeBom" }
androidx-compose-ui         = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3  = { module = "androidx.compose.material3:material3" }

# --- Test ---
junit               = { module = "junit:junit",                       version.ref = "junit" }
kotlin-test-junit   = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlinTestJunit" }
androidx-test-junit = { module = "androidx.test.ext:junit",           version.ref = "androidxTestJunit" }
androidx-test-core  = { module = "androidx.test:core",                version.ref = "androidxTestCore" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
robolectric          = { module = "org.robolectric:robolectric",      version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",     version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint              = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt              = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
